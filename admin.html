<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mewat Saathi Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#e4f7ec,transparent 35%),
        radial-gradient(circle at bottom right,#e7efff,transparent 35%),
        #f4f7f5;
    color:#17221b;
}

.container{
    width:min(1150px,94%);
    margin:25px auto 60px;
}

/* =========================
   HEADER
========================= */

.hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        #063d25,
        #087443,
        #10a35c
    );
    color:white;
    padding:38px 25px;
    border-radius:28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,70,40,.25);
}

.hero h1{
    margin:0 0 10px;
    font-size:34px;
}

.hero p{
    margin:0;
    opacity:.92;
    font-size:16px;
}

/* =========================
   CARD
========================= */

.card{
    margin-top:22px;
    background:rgba(255,255,255,.96);
    border-radius:24px;
    padding:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.08);
    border:1px solid #e4ebe6;
}

.card h2{
    margin-top:0;
    color:#075e36;
}

/* =========================
   LOGIN
========================= */

.login-box{
    max-width:500px;
    margin:25px auto;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #ccd6cf;
    border-radius:13px;
    font-size:16px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#0b9654;
    box-shadow:0 0 0 4px rgba(11,150,84,.10);
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:18px;
    background:linear-gradient(
        135deg,
        #08743f,
        #0ca45d
    );
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    background:#8b9590;
    cursor:not-allowed;
    transform:none;
}

/* =========================
   MESSAGE
========================= */

.message{
    margin-top:15px;
    padding:15px;
    border-radius:13px;
    display:none;
    line-height:1.5;
}

.success{
    background:#e8f8ee;
    color:#075e36;
    border:1px solid #9bd5b1;
}

.error{
    background:#fff0f0;
    color:#a00000;
    border:1px solid #efb0b0;
}

/* =========================
   ADMIN TOP
========================= */

.admin-top{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
}

.admin-top button{
    width:auto;
    padding:11px 18px;
    margin:0;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:20px;
}

.stat{
    padding:20px;
    border-radius:18px;
    background:linear-gradient(
        135deg,
        #f5faf7,
        #e9f5ee
    );
    border:1px solid #dce9df;
}

.stat-number{
    font-size:30px;
    font-weight:900;
    color:#075e36;
}

.stat-title{
    margin-top:5px;
    color:#637068;
}

/* =========================
   FILTER
========================= */

.filter-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* =========================
   COMPLAINT
========================= */

.complaint{
    margin-top:18px;
    padding:22px;
    border-radius:20px;
    border:1px solid #dfe8e2;
    background:#fff;
    box-shadow:0 7px 20px rgba(0,0,0,.05);
}

.complaint-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.complaint-id{
    font-size:22px;
    font-weight:900;
    color:#075e36;
}

.status{
    padding:8px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:800;
}

.status.pending{
    background:#fff1bd;
    color:#805d00;
}

.status.progress{
    background:#dcecff;
    color:#14518b;
}

.status.resolved{
    background:#dff5e5;
    color:#126431;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.info{
    background:#f7faf8;
    padding:14px;
    border-radius:13px;
}

.info strong{
    display:block;
    color:#075e36;
    font-size:13px;
    margin-bottom:5px;
}

.info span{
    font-size:15px;
    font-weight:600;
    word-break:break-word;
}

.info.full{
    grid-column:1/-1;
}

.complaint-text{
    line-height:1.6;
    white-space:pre-wrap;
}

/* =========================
   MEDIA
========================= */

.media-box{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-top:15px;
}

.media-box img{
    width:220px;
    max-width:100%;
    border-radius:15px;
    border:1px solid #dce5df;
}

.media-box video{
    width:320px;
    max-width:100%;
    border-radius:15px;
    background:#000;
}

/* =========================
   STATUS UPDATE
========================= */

.status-control{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #e5ebe7;
}

.status-control select{
    margin-top:8px;
}

.status-control button{
    margin-top:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:40px 15px;
    color:#68736c;
}

/* =========================
   HIDDEN
========================= */

.hidden{
    display:none!important;
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .filter-row{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .info.full{
        grid-column:auto;
    }

    .hero h1{
        font-size:28px;
    }

}

@media(max-width:500px){

    .stats{
        grid-template-columns:1fr;
    }

    .card{
        padding:18px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- =========================
         HEADER
    ========================= -->

    <div class="hero">

        <h1>🔐 Mewat Saathi Admin</h1>

        <p>
            Complaint Management Panel
        </p>

    </div>


    <!-- =========================
         LOGIN
    ========================= -->

    <div
        class="card login-box"
        id="loginBox"
    >

        <h2>🔐 Admin Login</h2>

        <p>
            Sirf authorised admin panel access kare.
        </p>

        <label>
            Username
        </label>

        <input
            type="text"
            id="adminUsername"
            placeholder="Admin username"
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Admin password"
        >


        <button
            type="button"
            onclick="adminLogin()"
        >
            🔓 Login
        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>


    <!-- =========================
         ADMIN PANEL
    ========================= -->

    <div
        class="card hidden"
        id="adminPanel"
    >

        <div class="admin-top">

            <div>

                <h2 style="margin-bottom:5px;">
                    📋 Complaints Dashboard
                </h2>

                <div
                    style="color:#69746d;"
                >
                    Mewat Saathi Complaint Management
                </div>

            </div>


            <button
                type="button"
                onclick="loadComplaints()"
            >
                🔄 Refresh
            </button>

        </div>


        <!-- =========================
             STATS
        ========================= -->

        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    0
                </div>

                <div class="stat-title">
                    Total
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    0
                </div>

                <div class="stat-title">
                    Pending
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="progressCount"
                >
                    0
                </div>

                <div class="stat-title">
                    In Progress
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="resolvedCount"
                >
                    0
                </div>

                <div class="stat-title">
                    Resolved
                </div>

            </div>

        </div>


        <!-- =========================
             FILTER
        ========================= -->

        <div
            class="filter-row"
            style="margin-top:25px;"
        >

            <div>

                <label>
                    Filter by Status
                </label>

                <select
                    id="statusFilter"
                    onchange="renderComplaints()"
                >

                    <option value="All">
                        All Complaints
                    </option>

                    <option value="Pending">
                        🟡 Pending
                    </option>

                    <option value="In Progress">
                        🔵 In Progress
                    </option>

                    <option value="Resolved">
                        🟢 Resolved
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Search
                </label>

                <input
                    type="text"
                    id="searchBox"
                    placeholder="Name, village, category..."
                    oninput="renderComplaints()"
                >

            </div>

        </div>


        <!-- =========================
             CONNECTION MESSAGE
        ========================= -->

        <div
            id="connectionMessage"
            class="message"
        ></div>


        <!-- =========================
             COMPLAINT LIST
        ========================= -->

        <div
            id="complaintsList"
        ></div>

    </div>


    <!-- HOME -->

    <div
        class="card"
        id="homeButton"
        style="display:none;"
    >

        <a
            href="index.html"
            style="text-decoration:none;"
        >

            <button type="button">
                🏠 Home Par Wapas Jayein
            </button>

        </a>

    </div>

</div>


<script>

/*
==================================================
IMPORTANT
==================================================

Backend Flask:
https://mewat-saathi.onrender.com

Website:
http://127.0.0.1:5500

Dono alag servers hain.
==================================================
*/

const BACKEND_URL =
    "http://127.0.0.1:5000";


let complaintsData = [];


/* =========================
   LOGIN
========================= */

function adminLogin(){

    const username =
        document.getElementById(
            "adminUsername"
        ).value.trim();


    const password =
        document.getElementById(
            "adminPassword"
        ).value.trim();


    const message =
        document.getElementById(
            "loginMessage"
        );


    /*
    NOTE:
    Ye abhi frontend demo login hai.
    Baad mein proper secure admin
    authentication backend mein banayenge.
    */

    if(
        username === "admin" &&
        password === "1234"
    ){

        document.getElementById(
            "loginBox"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "adminPanel"
        ).classList.remove(
            "hidden"
        );


        document.getElementById(
            "homeButton"
        ).style.display =
            "block";


        loadComplaints();

    }

    else{

        message.className =
            "message error";

        message.style.display =
            "block";

        message.innerHTML =
            "❌ Username ya password galat hai.";

    }

}


/* =========================
   LOAD COMPLAINTS
========================= */

async function loadComplaints(){

    const message =
        document.getElementById(
            "connectionMessage"
        );


    message.style.display =
        "none";


    try{

        const response =
            await fetch(
                BACKEND_URL +
                "/complaints"
            );


        if(!response.ok){

            throw new Error(
                "Backend response: " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Invalid backend data"
            );

        }


        complaintsData =
            data;


        updateStats();

        renderComplaints();

    }

    catch(error){

        console.error(
            "ADMIN CONNECTION ERROR:",
            error
        );


        message.className =
            "message error";

        message.style.display =
            "block";


        message.innerHTML = `

            ❌ <b>Backend se connection nahi ho paya.</b>

            <br><br>

            Check karein:

            <br>
            1. <b>python app.py</b> wala terminal chalu hai.

            <br>
            2. Backend
            <b>127.0.0.1:5000</b>
            par chal raha hai.

            <br>
            3. Browser refresh karke dobara try karein.

        `;

    }

}


/* =========================
   STATS
========================= */

function updateStats(){

    const total =
        complaintsData.length;


    const pending =
        complaintsData.filter(
            item =>
            item.status === "Pending"
        ).length;


    const progress =
        complaintsData.filter(
            item =>
            item.status === "In Progress"
        ).length;


    const resolved =
        complaintsData.filter(
            item =>
            item.status === "Resolved"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "progressCount"
    ).textContent =
        progress;


    document.getElementById(
        "resolvedCount"
    ).textContent =
        resolved;

}


/* =========================
   RENDER
========================= */

function renderComplaints(){

    const container =
        document.getElementById(
            "complaintsList"
        );


    const filter =
        document.getElementById(
            "statusFilter"
        ).value;


    const search =
        document.getElementById(
            "searchBox"
        ).value
        .trim()
        .toLowerCase();


    let filtered =
        complaintsData.filter(
            item => {

                const statusMatch =
                    filter === "All" ||
                    item.status === filter;


                const searchText = (

                    (item.name || "") +
                    " " +
                    (item.village || "") +
                    " " +
                    (item.category || "") +
                    " " +
                    (item.complaint || "")

                ).toLowerCase();


                const searchMatch =
                    !search ||
                    searchText.includes(search);


                return (
                    statusMatch &&
                    searchMatch
                );

            }
        );


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                📭

                <br><br>

                <b>Koi complaint nahi mili.</b>

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered
        .map(
            complaintCard
        )
        .join("");

}


/* =========================
   COMPLAINT CARD
========================= */

function complaintCard(item){

    let statusClass =
        "pending";


    if(
        item.status ===
        "In Progress"
    ){

        statusClass =
            "progress";

    }


    if(
        item.status ===
        "Resolved"
    ){

        statusClass =
            "resolved";

    }


    let photoHTML = "";


    if(item.photo){

        photoHTML = `

            <img
                src="${BACKEND_URL}/media/${encodeURIComponent(item.photo)}"
                alt="Complaint Photo"
            >

        `;

    }


    let videoHTML = "";


    if(item.video){

        videoHTML = `

            <video
                controls
                src="${BACKEND_URL}/media/${encodeURIComponent(item.video)}"
            ></video>

        `;

    }


    return `

        <div class="complaint">

            <div class="complaint-header">

                <div class="complaint-id">

                    🆔 Complaint #${item.id}

                </div>

                <div
                    class="status ${statusClass}"
                >

                    ${statusIcon(item.status)}
                    ${escapeHTML(item.status || "Pending")}

                </div>

            </div>


            <div class="info-grid">


                <div class="info">

                    <strong>
                        👤 Name
                    </strong>

                    <span>
                        ${escapeHTML(item.name || "-")}
                    </span>

                </div>


                <div class="info">

                    <strong>
                        📱 Mobile
                    </strong>

                    <span>
                        ${escapeHTML(item.mobile || "-")}
                    </span>

                </div>


                <div class="info">

                    <strong>
                        📍 Village / Area
                    </strong>

                    <span>
                        ${escapeHTML(item.village || "-")}
                    </span>

                </div>


                <div class="info">

                    <strong>
                        📂 Category
                    </strong>

                    <span>
                        ${escapeHTML(item.category || "-")}
                    </span>

                </div>


                <div class="info full">

                    <strong>
                        📝 Complaint
                    </strong>

                    <div class="complaint-text">

                        ${escapeHTML(item.complaint || "-")}

                    </div>

                </div>


            </div>


            ${
                photoHTML || videoHTML
                ?
                `
                <div class="media-box">

                    ${photoHTML}

                    ${videoHTML}

                </div>
                `
                :
                ""
            }


            <div class="status-control">

                <strong>
                    ⚙️ Update Complaint Status
                </strong>


                <select
                    id="status-${item.id}"
                >

                    <option
                        value="Pending"
                        ${item.status === "Pending" ? "selected" : ""}
                    >
                        🟡 Pending
                    </option>


                    <option
                        value="In Progress"
                        ${item.status === "In Progress" ? "selected" : ""}
                    >
                        🔵 In Progress
                    </option>


                    <option
                        value="Resolved"
                        ${item.status === "Resolved" ? "selected" : ""}
                    >
                        🟢 Resolved
                    </option>

                </select>


                <button
                    type="button"
                    onclick="updateStatus(${item.id})"
                >
                    💾 Update Status
                </button>

            </div>

        </div>

    `;

}


/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(id){

    const select =
        document.getElementById(
            "status-" + id
        );


    const newStatus =
        select.value;


    const formData =
        new FormData();


    formData.append(
        "status",
        newStatus
    );


    try{

        const response =
            await fetch(

                BACKEND_URL +
                "/complaint/" +
                id +
                "/status",

                {
                    method:"POST",
                    body:formData
                }

            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            alert(
                data.error ||
                "Status update nahi hua."
            );

            return;

        }


        alert(
            "✅ Complaint #" +
            id +
            " ka status update ho gaya."
        );


        await loadComplaints();

    }

    catch(error){

        console.error(error);

        alert(
            "❌ Backend se connection nahi ho paya."
        );

    }

}


/* =========================
   STATUS ICON
========================= */

function statusIcon(status){

    if(status === "In Progress"){
        return "🔵";
    }

    if(status === "Resolved"){
        return "🟢";
    }

    return "🟡";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
