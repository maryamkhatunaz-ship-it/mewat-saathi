<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scholarship Details - Mewat Saathi</title>

    <link rel="stylesheet" href="style.css">
    <script src="scholarships-data.js"></script>

    <style>
        .details-page{
            max-width:900px;
            margin:auto;
            padding:20px;
        }

        .topbar{
            display:flex;
            justify-content:space-between;
            gap:10px;
            align-items:center;
            margin-bottom:15px;
        }

        .back-btn{
            text-decoration:none;
            background:#075e54;
            color:white;
            padding:10px 15px;
            border-radius:10px;
            font-weight:700;
        }

        .language-box{
            display:flex;
            gap:6px;
        }

        .lang-btn{
            border:1px solid #ddd;
            background:white;
            padding:7px 12px;
            border-radius:18px;
            cursor:pointer;
        }

        .lang-btn.active{
            background:#075e54;
            color:white;
        }

        .detail-card{
            background:white;
            border-radius:22px;
            padding:25px;
            box-shadow:0 6px 25px rgba(0,0,0,.08);
        }

        .badge{
            display:inline-block;
            background:#e9f7f4;
            color:#075e54;
            padding:7px 11px;
            border-radius:20px;
            font-size:12px;
            font-weight:700;
            margin:3px;
        }

        h1{
            margin:15px 0;
        }

        .main-benefit{
            background:#fff8df;
            border:1px solid #efdf9b;
            padding:20px;
            border-radius:17px;
            margin:18px 0;
        }

        .main-benefit h2{
            margin:0 0 8px;
            color:#806600;
        }

        .main-benefit p{
            font-size:20px;
            font-weight:800;
            color:#5d4a00;
            margin:0;
        }

        .section{
            margin-top:22px;
            padding-top:20px;
            border-top:1px solid #eee;
        }

        .section h2{
            color:#075e54;
        }

        .list{
            padding-left:20px;
        }

        .list li{
            margin-bottom:8px;
        }

        .apply-main{
            display:inline-block;
            background:#075e54;
            color:white;
            text-decoration:none;
            padding:13px 18px;
            border-radius:12px;
            font-weight:800;
            margin-top:10px;
        }

        .source{
            background:#f6f8f8;
            padding:15px;
            border-radius:12px;
            margin-top:15px;
        }

        .notice{
            background:#fff3f3;
            border:1px solid #ffd2d2;
            padding:14px;
            border-radius:12px;
            color:#8b2525;
        }

        @media(max-width:600px){
            .topbar{
                flex-direction:column;
                align-items:stretch;
            }

            .language-box{
                justify-content:flex-end;
            }
        }
    </style>
</head>

<body>

<div class="details-page">

    <div class="topbar">

        <a href="scholarship.html" class="back-btn" id="backBtn">
            ← Scholarships पर वापस
        </a>

        <div class="language-box">
            <button class="lang-btn active" id="hiBtn" onclick="changeLanguage('hi')">हिंदी</button>
            <button class="lang-btn" id="enBtn" onclick="changeLanguage('en')">English</button>
        </div>

    </div>

    <main id="details"></main>

</div>

<script>

let params=new URLSearchParams(location.search);
let id=params.get("id");
let currentLanguage=params.get("lang") || localStorage.getItem("scholarshipLanguage") || "hi";

let scholarship=scholarships.find(s=>s.id===id);

function changeLanguage(lang){
    currentLanguage=lang;
    localStorage.setItem("scholarshipLanguage",lang);

    document.getElementById("hiBtn").classList.toggle("active",lang==="hi");
    document.getElementById("enBtn").classList.toggle("active",lang==="en");

    render();
}

function render(){

    const box=document.getElementById("details");

    if(!scholarship){

        box.innerHTML=`
            <div class="detail-card">
                <h2>${currentLanguage==="hi" ? "Scholarship नहीं मिली" : "Scholarship not found"}</h2>
                <a href="scholarship.html" class="apply-main">
                    ${currentLanguage==="hi" ? "Scholarships पर वापस जाएँ" : "Back to Scholarships"}
                </a>
            </div>
        `;

        return;
    }

    const s=scholarship;

    const name=currentLanguage==="hi" ? s.nameHi : s.nameEn;
    const benefit=currentLanguage==="hi" ? s.benefitHi : s.benefitEn;
    const eligibility=currentLanguage==="hi" ? s.eligibilityHi : s.eligibilityEn;
    const documents=currentLanguage==="hi" ? s.documentsHi : s.documentsEn;
    const process=currentLanguage==="hi" ? s.processHi : s.processEn;
    const notes=currentLanguage==="hi" ? s.notesHi : s.notesEn;

    const labels=currentLanguage==="hi" ? {
        benefit:"💰 Benefit / आपको क्या मिल सकता है?",
        eligibility:"✅ कौन Apply कर सकता है?",
        documents:"📄 कौन-कौन से Documents चाहिए?",
        process:"📝 Apply करने का तरीका",
        date:"⏰ Important Date",
        level:"🎓 Education Level",
        category:"👤 Category",
        course:"🏫 Course / Area",
        official:"🔗 Official Application",
        source:"✓ Official Source / Verification",
        note:"⚠️ जरूरी बात",
        apply:"📝 Apply / Official Portal खोलें",
        verified:"Last verified"
    } : {
        benefit:"💰 Benefit / What You May Get",
        eligibility:"✅ Who Can Apply?",
        documents:"📄 Required Documents",
        process:"📝 How to Apply",
        date:"⏰ Important Date",
        level:"🎓 Education Level",
        category:"👤 Category",
        course:"🏫 Course / Area",
        official:"🔗 Official Application",
        source:"✓ Official Source / Verification",
        note:"⚠️ Important",
        apply:"📝 Open Official Application",
        verified:"Last verified"
    };

    box.innerHTML=`

        <article class="detail-card">

            <div>
                <span class="badge">📍 ${safe(s.stateLabel)}</span>
                <span class="badge">🎓 ${safe(s.levelLabel)}</span>
                <span class="badge">👤 ${safe(s.categoryLabel)}</span>
            </div>

            <h1>${safe(name)}</h1>

            <div class="main-benefit">
                <h2>${labels.benefit}</h2>
                <p>${safe(benefit)}</p>
            </div>

            <div class="section">
                <h2>${labels.eligibility}</h2>
                <p>${safe(eligibility)}</p>
            </div>

            <div class="section">
                <h2>${labels.documents}</h2>
                <ul class="list">
                    ${documents.map(x=>`<li>${safe(x)}</li>`).join("")}
                </ul>
            </div>

            <div class="section">
                <h2>${labels.date}</h2>
                <p><strong>${safe(s.deadline)}</strong></p>
            </div>

            <div class="section">
                <h2>${labels.level}</h2>
                <p>${safe(s.levelLabel)}</p>
            </div>

            <div class="section">
                <h2>${labels.course}</h2>
                <p>${safe(s.courseLabel)}</p>
            </div>

            <div class="section">
                <h2>${labels.process}</h2>
                <ol class="list">
                    ${process.map(x=>`<li>${safe(x)}</li>`).join("")}
                </ol>
            </div>

            <div class="section">
                <h2>${labels.official}</h2>

                <a class="apply-main"
                   href="${safeAttr(s.applyUrl)}"
                   target="_blank"
                   rel="noopener noreferrer">
                    ${labels.apply}
                </a>
            </div>

            <div class="source">
                <strong>${labels.source}</strong>
                <p>${safe(s.sourceName)}</p>
                <small>${labels.verified}: ${safe(s.lastVerified)}</small>
            </div>

            <div class="section">
                <h2>${labels.note}</h2>
                <p>${safe(notes)}</p>
            </div>

        </article>
    `;
}

function safe(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function safeAttr(value){
    return safe(value);
}

document.addEventListener("DOMContentLoaded",()=>{
    changeLanguage(currentLanguage);
});

</script>

</body>
</html>
